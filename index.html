
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>أسفلت مصر 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;color:white;font-family:Arial,sans-serif}
#scene{position:fixed;inset:0}
canvas{display:block}
.topbar{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#061426df;border:1px solid #1689c9;border-radius:12px;padding:10px}
.brand{font-weight:bold;font-size:18px;color:#ffd24a}
.small{font-size:12px;color:#9bc7e2}
.wallet{font-size:14px}
#score,#speed,#coins{font-weight:bold;color:#ffd24a}
.controls{position:fixed;bottom:18px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end}
.group{display:flex;gap:12px}
button{border:1px solid #1689c9;border-radius:14px;background:#102c45;color:white;font-size:24px;font-weight:bold;min-width:64px;min-height:60px;padding:12px;touch-action:none}
button:active{background:#087395}
#start-screen,#game-over{position:fixed;inset:0;background:#061426ed;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{width:min(100%,360px);background:#10243c;border:1px solid #1689c9;border-radius:20px;padding:24px}
h1{font-size:26px;color:#ffd24a}
p{line-height:1.7}
#game-over{display:none}
</style>
</head>
<body>
<div id="scene"></div>
<div class="topbar">
  <div class="panel"><div class="brand">🇪🇬 أسفلت مصر 3D</div><div class="small">سباق شوارع مصر</div></div>
  <div class="panel wallet">النقاط: <span id="score">0</span><br>السرعة: <span id="speed">0</span><br>العملات: <span id="coins">0</span></div>
</div>
<div class="controls">
  <div class="group">
    <button id="left" aria-label="يسار">◀</button>
    <button id="right" aria-label="يمين">▶</button>
  </div>
  <div class="group">
    <button id="brake">▼</button>
    <button id="gas">▲</button>
  </div>
</div>
<div id="start-screen">
  <div class="card">
    <h1>أسفلت مصر 3D</h1>
    <p>استعد للقيادة في شوارع مصر! تفادى العربيات واجمع العملات.</p>
    <button id="start">ابدأ القيادة 🚗</button>
  </div>
</div>
<div id="game-over">
  <div class="card">
    <h1>انتهت الجولة</h1>
    <p>نقاطك: <span id="final-score">0</span></p>
    <button id="restart">العب تاني</button>
  </div>
</div>
<script type="module" src="./game.js"></script>
</body>
</html>
